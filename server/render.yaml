services:
  - type: web
    name: omnistream-whatsapp-bot
    runtime: node
    plan: free
    buildCommand: bash render-build.sh
    startCommand: node index.js
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/server/chrome
