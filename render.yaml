services:
  - type: web
    name: omnistream-whatsapp-bot
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx puppeteer browsers install chrome
    startCommand: node index.js
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/server/.cache/puppeteer
